name: CI

on:
  push:
    branches: [master, vps-upload]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP sources
        run: find app config src test utils -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  dependencies-and-tests:
    name: Dependencies and regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: bcmath, curl, gd, mbstring, mysqli, pdo_mysql, xml, zip
          coverage: none
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run protocol regression tests
        run: composer test
      - name: Audit dependencies
        run: composer audit --locked --no-interaction

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sspanel-metron:ci
